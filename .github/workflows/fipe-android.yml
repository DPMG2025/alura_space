name: App Android FIPE

on:
  push:
    paths:
      - "fipe-app/**"
      - ".github/workflows/fipe-android.yml"
  pull_request:
    paths:
      - "fipe-app/**"
  workflow_dispatch:

concurrency:
  group: fipe-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fipe-app
    steps:
      - uses: actions/checkout@v5

      # O runner ubuntu-latest ja traz o Android SDK (ANDROID_HOME).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      # Regressao visual: compara as telas com as capturas da versao anterior (docs/capturas)
      - name: Comparar capturas com a versao anterior
        continue-on-error: true
        env:
          ROBORAZZI_MODO: verify
        run: |
          mkdir -p app/build/outputs/roborazzi
          cp docs/capturas/*.png app/build/outputs/roborazzi/ 2>/dev/null || true
          if ./gradlew testDebugUnitTest --tests "br.com.fipeplaca.TelasCapturaTest" --no-daemon -q; then
            echo "Nenhuma tela mudou em relacao a versao anterior." > regressao-visual.txt
          else
            echo "Telas com diferenca visual em relacao a versao anterior (revisar):" > regressao-visual.txt
            grep -l "<failure" app/build/test-results/testDebugUnitTest/TEST-br.com.fipeplaca.TelasCapturaTest.xml >/dev/null 2>&1 && \
              grep -o 'testcase name="[^"]*"[^>]*>\s*<failure' app/build/test-results/testDebugUnitTest/TEST-br.com.fipeplaca.TelasCapturaTest.xml | sed 's/testcase name="\([^"]*\)".*/\1/' >> regressao-visual.txt || true
          fi
          rm -rf app/build/outputs/roborazzi

      - name: Testes unitarios e capturas de tela
        run: ./gradlew testDebugUnitTest --no-daemon

      # Confere os formatos das APIs reais da FIPE (nao bloqueia o build se a API estiver fora do ar).
      - name: Verificar APIs reais da FIPE
        continue-on-error: true
        env:
          FIPE_ONLINE: "true"
          FIPE_API_TOKEN: ${{ secrets.FIPE_API_TOKEN }}
        run: |
          rm -f app/build/outputs/api-real.txt
          ./gradlew testDebugUnitTest --tests "br.com.fipeplaca.ApiRealTest" --rerun-tasks --no-daemon

      - name: Publicar capturas de tela
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: capturas-de-tela
          path: fipe-app/app/build/outputs/roborazzi/*.png
          if-no-files-found: warn

      # Guarda as capturas no proprio branch (pasta docs/capturas) para revisao e para o README.
      - name: Versionar capturas de tela
        if: github.event_name == 'push' && !cancelled()
        run: |
          mkdir -p docs/capturas
          rm -f docs/capturas/*.png
          cp app/build/outputs/roborazzi/*.png docs/capturas/ 2>/dev/null || git checkout -- docs/capturas
          if [ -f app/build/outputs/api-real.txt ]; then cp app/build/outputs/api-real.txt docs/verificacao-api-real.txt; fi
          if [ -f regressao-visual.txt ]; then cp regressao-visual.txt docs/regressao-visual.txt; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Capturas sem alteracao"
          else
            git commit -m "Atualiza capturas de tela [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Relatorio dos testes
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: relatorio-testes
          path: fipe-app/app/build/reports/tests/

      - name: Gerar APK
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - uses: actions/upload-artifact@v5
        with:
          name: fipe-pela-placa-apk
          path: |
            fipe-app/app/build/outputs/apk/debug/app-debug.apk
            fipe-app/app/build/outputs/apk/release/app-release.apk

  # Testes de ponta a ponta num emulador Android real, com internet real.
  emulador:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: fipe-app
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Testes no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: fipe-app
          script: |
            ./gradlew connectedDebugAndroidTest --no-daemon || echo "FALHA_TESTES" > emulador-falhou.txt
            ./gradlew assembleRelease --no-daemon -q
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            adb shell am start -W -n br.com.fipeplaca/.MainActivity
            sleep 15
            adb logcat -d > logcat-release.txt
            if adb shell pidof br.com.fipeplaca > /dev/null && ! grep -q "FATAL EXCEPTION" logcat-release.txt; then echo "APK release (R8) abriu e carregou dados sem falhas" > release-ok.txt; else echo "FALHA_RELEASE" > emulador-falhou.txt; grep -A 20 "FATAL EXCEPTION" logcat-release.txt | head -40 > release-erro.txt; fi

      - name: Versionar resultado do emulador
        if: github.event_name == 'push' && !cancelled()
        run: |
          rm -rf docs/emulador && mkdir -p docs/emulador
          find app/build/outputs/connected_android_test_additional_output -type f \( -name "*.png" -o -name "*.txt" \) -exec cp {} docs/emulador/ \; 2>/dev/null || true
          ls docs/emulador/*.png >/dev/null 2>&1 || echo "sem capturas" > docs/emulador/relatorio.txt
          cat release-ok.txt release-erro.txt >> docs/emulador/relatorio.txt 2>/dev/null || true
          if [ -f emulador-falhou.txt ]; then echo "RESULTADO: FALHOU" >> docs/emulador/relatorio.txt; else echo "RESULTADO: TODOS OS TESTES PASSARAM" >> docs/emulador/relatorio.txt; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/emulador
          git diff --cached --quiet || git commit -m "Atualiza resultado do emulador [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Relatorio do emulador
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: relatorio-emulador
          path: fipe-app/app/build/reports/androidTests/
          if-no-files-found: ignore

      - name: Falhar se os testes do emulador falharam
        run: test ! -f emulador-falhou.txt
