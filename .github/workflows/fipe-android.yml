name: App Android FIPE

on:
  push:
    paths:
      - "fipe-app/**"
      - ".github/workflows/fipe-android.yml"
  pull_request:
    paths:
      - "fipe-app/**"
  workflow_dispatch:

concurrency:
  group: fipe-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fipe-app
    steps:
      - uses: actions/checkout@v5

      # O runner ubuntu-latest ja traz o Android SDK (ANDROID_HOME).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Testes unitarios e capturas de tela
        run: ./gradlew testDebugUnitTest --no-daemon

      # Confere os formatos das APIs reais da FIPE (nao bloqueia o build se a API estiver fora do ar).
      - name: Verificar APIs reais da FIPE
        continue-on-error: true
        env:
          FIPE_ONLINE: "true"
          FIPE_API_TOKEN: ${{ secrets.FIPE_API_TOKEN }}
        run: |
          rm -f app/build/outputs/api-real.txt
          ./gradlew testDebugUnitTest --tests "br.com.fipeplaca.ApiRealTest" --rerun-tasks --no-daemon

      - name: Publicar capturas de tela
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: capturas-de-tela
          path: fipe-app/app/build/outputs/roborazzi/*.png
          if-no-files-found: warn

      # Guarda as capturas no proprio branch (pasta docs/capturas) para revisao e para o README.
      - name: Versionar capturas de tela
        if: github.event_name == 'push' && !cancelled()
        run: |
          mkdir -p docs/capturas
          rm -f docs/capturas/*.png
          cp app/build/outputs/roborazzi/*.png docs/capturas/
          if [ -f app/build/outputs/api-real.txt ]; then cp app/build/outputs/api-real.txt docs/verificacao-api-real.txt; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Capturas sem alteracao"
          else
            git commit -m "Atualiza capturas de tela [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Relatorio dos testes
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: relatorio-testes
          path: fipe-app/app/build/reports/tests/

      - name: Gerar APK
        env:
          # Opcional: cadastre os segredos no repositorio para embutir os tokens no APK.
          PLACA_API_TOKEN: ${{ secrets.PLACA_API_TOKEN }}
          FIPE_API_TOKEN: ${{ secrets.FIPE_API_TOKEN }}
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - uses: actions/upload-artifact@v5
        with:
          name: fipe-pela-placa-apk
          path: |
            fipe-app/app/build/outputs/apk/debug/app-debug.apk
            fipe-app/app/build/outputs/apk/release/app-release.apk
