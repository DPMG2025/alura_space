name: Casinha do Saber (Android)

on:
  push:
    paths:
      - "casinha-do-saber/**"
      - ".github/workflows/casinha-do-saber.yml"
  pull_request:
    paths:
      - "casinha-do-saber/**"
  workflow_dispatch:

concurrency:
  group: casinha-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: casinha-do-saber
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Testes de unidade e capturas de tela
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Publicar capturas de tela
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: capturas-de-tela
          path: casinha-do-saber/app/build/outputs/roborazzi/*.png
          if-no-files-found: warn

      # Guarda as capturas no próprio branch (docs/capturas) para revisão e para o README.
      - name: Versionar capturas de tela
        if: github.event_name == 'push' && !cancelled()
        run: |
          mkdir -p docs/capturas
          if ls app/build/outputs/roborazzi/*.png >/dev/null 2>&1; then
            rm -f docs/capturas/*.png
            cp app/build/outputs/roborazzi/*.png docs/capturas/
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Capturas sem alteração"
          else
            git commit -m "Atualiza capturas de tela [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      # Se os segredos da chave de upload existirem, o release sai assinado para a Play Store.
      - name: Preparar chave de upload
        env:
          CHAVE_BASE64: ${{ secrets.CASINHA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$CHAVE_BASE64" ]; then
            echo "$CHAVE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "CASINHA_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Chave de upload configurada"
          else
            echo "Sem chave de upload: o release usa a chave de debug (só para testes)"
          fi

      - name: Gerar APK e pacote da Play Store
        env:
          CASINHA_KEYSTORE_PASSWORD: ${{ secrets.CASINHA_KEYSTORE_PASSWORD }}
          CASINHA_KEY_ALIAS: ${{ secrets.CASINHA_KEY_ALIAS }}
          CASINHA_KEY_PASSWORD: ${{ secrets.CASINHA_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease

      - name: Publicar pacote da Play Store (.aab)
        uses: actions/upload-artifact@v5
        with:
          name: casinha-do-saber-play-store
          path: casinha-do-saber/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # Versão para testar no celular: um link direto do .apk na página de Releases do GitHub,
      # sempre atualizado com o último build deste branch.
      - name: Publicar versão de teste (Releases)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk CasinhaDoSaber.apk
          gh release delete casinha-teste --yes --cleanup-tag || true
          gh release create casinha-teste CasinhaDoSaber.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Casinha do Saber (versão de teste)" \
            --notes "Versão de teste, atualizada a cada mudança no branch ${GITHUB_REF_NAME} (commit ${GITHUB_SHA::7}).

          Como instalar no celular Android:
          1. Toque em CasinhaDoSaber.apk (em Assets, logo abaixo) para baixar.
          2. Abra o arquivo baixado. Se o Android pedir, permita instalar apps desta fonte.
          3. Toque em Instalar.

          Para atualizar depois, baixe e instale de novo por cima: o progresso fica guardado."

      - name: Publicar APKs
        uses: actions/upload-artifact@v5
        with:
          name: casinha-do-saber-apk
          path: |
            casinha-do-saber/app/build/outputs/apk/debug/*.apk
            casinha-do-saber/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publicar relatórios
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: relatorios
          path: |
            casinha-do-saber/app/build/reports/
          if-no-files-found: ignore

  # Testes de ponta a ponta num Android de verdade (emulador): jogar, abrir presente, arrastar móvel.
  emulador:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: casinha-do-saber
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Testes no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          working-directory: casinha-do-saber
          script: |
            ./gradlew connectedDebugAndroidTest --no-daemon || echo "FALHA_TESTES" > emulador-falhou.txt

      - name: Versionar resultado do emulador
        if: github.event_name == 'push' && !cancelled()
        run: |
          rm -rf docs/emulador && mkdir -p docs/emulador
          find app/build/outputs/connected_android_test_additional_output -type f \( -name "*.png" -o -name "*.txt" \) -exec cp {} docs/emulador/ \; 2>/dev/null || true
          find app/build/outputs/androidTest-results -name "*.xml" -exec grep -h -A8 "<failure" {} \; > docs/emulador/falhas.txt 2>/dev/null || true
          [ -s docs/emulador/falhas.txt ] || rm -f docs/emulador/falhas.txt
          if [ -f emulador-falhou.txt ]; then echo "RESULTADO: FALHOU" > docs/emulador/relatorio.txt; else echo "RESULTADO: TODOS OS TESTES PASSARAM" > docs/emulador/relatorio.txt; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/emulador
          git diff --cached --quiet || git commit -m "Atualiza resultado do emulador [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Relatório do emulador
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: relatorio-emulador
          path: casinha-do-saber/app/build/reports/androidTests/
          if-no-files-found: ignore

      - name: Falhar se os testes do emulador falharam
        run: test ! -f emulador-falhou.txt
