<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="ui2.css">
<style>
  .tela { background: linear-gradient(180deg, #6cc3ff 0%, #a6dcff 35%, #ffe7d1 75%, #ffd0e0 100%); }
  #c { left: 0; top: 0; width: 393px; height: 852px; }
  #k { left: 4px; top: 92px; width: 150px; height: 190px; }
  .contas { position: absolute; left: 50%; transform: translateX(-50%); top: 24px; height: 40px; padding: 0 12px; border-radius: 20px; display: flex; gap: 8px; align-items: center; background: rgba(255,255,255,.75); box-shadow: 0 4px 0 rgba(120,100,200,.25); }
  .conta { width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff 0 15%, #e7e1f7 60%, #cfc4ef); box-shadow: inset 0 -2px 3px rgba(0,0,0,.12); }
  .conta.feita { background: radial-gradient(circle at 35% 30%, #fff 0 12%, #6fe08e 35%, #26a85a); }
  .conta.vez { width: 28px; height: 28px; background: radial-gradient(circle at 35% 30%, #fff 0 14%, #ffd75a 40%, #f5a300); }
  .respostas { position: absolute; left: 16px; right: 16px; bottom: 30px; display: grid; grid-template-columns: 1fr 1fr; gap: 22px 16px; }
  .resp { position: relative !important; height: 104px; display: grid; place-items: center; font-size: 66px; font-weight: 800; line-height: 1; }
  .resp span { transform: translateY(4px); }
</style></head>
<body><div class="tela">
  <canvas id="c" class="cena"></canvas>
  <canvas id="k" class="cena"></canvas>
  <div class="redondo" style="left:16px;top:16px"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="#7c5cff" stroke-width="3.4" stroke-linecap="round"/></svg></div>
  <div class="contas"><div class="conta feita"></div><div class="conta feita"></div><div class="conta vez"></div><div class="conta"></div><div class="conta"></div></div>
  <div class="redondo" style="right:16px;top:16px"><svg viewBox="0 0 24 24"><path fill="#7c5cff" d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="#7c5cff" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg></div>
  <div class="balao" style="left:150px;right:14px;top:110px">Quantos patinhos tem na lagoa?
    <svg style="position:absolute;left:-18px;top:34px" width="24" height="30" viewBox="0 0 24 30"><path d="M24 0 L0 16 L24 28 Z" fill="#fbf9ff"/></svg></div>
  <div class="respostas">
    <div class="bloco resp contorno-escuro" style="--c:#ff7a6b;--c2:#f2524a;--b:#c4342e"><span>3</span></div>
    <div class="bloco resp contorno-escuro" style="--c:#5fb2ff;--c2:#3b8ff0;--b:#2366c4"><span>5</span></div>
    <div class="bloco resp contorno-escuro" style="--c:#57d989;--c2:#2fbf68;--b:#1d9150"><span>4</span></div>
    <div class="bloco resp contorno-escuro" style="--c:#ffc94d;--c2:#ffad1f;--b:#d08100"><span>6</span></div>
  </div>
</div>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
<script type="module">
import { THREE, palco, luzes, crianca, irmaozinho, casinha, ilhaDeGrama, arvore, arbusto, flor, nuvem, patinho, em, bola, plastico, cilindro, malha, massinha } from './kit.js';
await document.fonts.ready;

// cena principal: campo, lagoa e patinhos
const p = palco(document.getElementById('c'), { largura: 393, altura: 852, fov: 34, exposicao: 0.92 });
luzes(p.cena, { sol: [5, 12, 8], forca: 2.9, area: 9, alvo: [0, 0, 0], amb: 0.6 });
const ilha = ilhaDeGrama(6.6); p.cena.add(ilha);
for (const [x, z, sc] of [[-4.3, -3.6, 1.15], [4.4, -3.2, 0.95], [-1.6, -5.0, 0.8]]) p.cena.add(em(arvore({ s: sc }), x, 0.14, z));
for (const [x, y, z, sc] of [[-5.5, 6.5, -12, 1.6], [5.5, 8.5, -15, 1.3], [0.5, 10.5, -20, 1.1]]) p.cena.add(em(nuvem(sc), x, y, z));
// lagoa
const borda = cilindro(3.9, 4.1, 0.3, plastico('#e9dcc6', { rugosidade: 0.85, verniz: 0 }), 64); p.cena.add(em(borda, 0, 0.05, 0));
const agua = cilindro(3.55, 3.55, 0.3, plastico('#47b8ff', { rugosidade: 0.05, verniz: 1 }), 64); p.cena.add(em(agua, 0, 0.26, 0));
agua.material = new THREE.MeshPhysicalMaterial({ color: '#0b84f0', roughness: 0.08, clearcoat: 1, clearcoatRoughness: 0.05, envMapIntensity: 1.1 });
for (let k = 0; k < 22; k++) { if (false) continue;
  const a = k / 22 * Math.PI * 2;
  const pedra = bola(0.42 + (k % 3) * 0.08, plastico(['#d9cbb3', '#c9b99e', '#e6dac4'][k % 3], { rugosidade: 0.85, verniz: 0 }), 24);
  pedra.scale.set(1, 0.55, 1); p.cena.add(em(pedra, Math.cos(a) * 3.9, 0.3, Math.sin(a) * 3.9));
}
for (const [x, z, r] of [[-2.2, 1.0, 0.55], [2.4, -1.2, 0.45], [-0.6, -2.3, 0.4]]) {
  const folha = cilindro(r, r, 0.05, plastico('#3fae4a', { rugosidade: 0.5, verniz: 0.4 }), 32); p.cena.add(em(folha, x, 0.43, z));
  if (r > 0.5) { const fl = flor('#ff7fb0', 1.2); p.cena.add(em(fl, x + 0.1, 0.25, z)); }
}
const posPatos = [[-1.3, -0.6, 0.6], [1.0, 0.9, -2.4], [1.5, -1.0, -1.2], [-0.4, 1.4, 0.4]];
for (const [x, z, giro] of posPatos) { const pt = patinho(1.0, '#ffc400'); pt.rotation.y = giro; p.cena.add(em(pt, x, 0.3, z)); }
// flores e arbustos em volta
p.cena.add(em(arbusto('#4fae3e', 1.2), -5.3, 0.14, 1.2));
p.cena.add(em(arbusto('#5bb94a', 1.0), 5.3, 0.14, 0.6));
const cores = ['#ff5c8a', '#ffd23f', '#9b6bff', '#ffffff', '#ff8c1a'];
[[-4.6, 3.6], [-3.3, 4.8], [4.3, 3.4], [5.0, 2.2], [3.0, 5.2], [-5.6, -1.2], [5.6, -1.6], [-1.3, 5.4], [1.5, 5.6]].forEach(([x, z], i) => p.cena.add(em(flor(cores[i % 5], 1.6), x, 0.14, z)));
p.cam.position.set(0, 15.5, 23.5);
p.cam.lookAt(0, -2.2, -1.0);
p.desenhar();

// as crianças, em canvas próprio (transparente)
const k = palco(document.getElementById('k'), { largura: 150, altura: 190, fov: 26 });
luzes(k.cena, { sol: [4, 7, 8], forca: 2.6, area: 4 });
const ana = crianca({ humor: 'feliz', bracos: 'tchau' }); em(ana, -0.55, 0, 0); ana.rotation.y = 0.25; k.cena.add(ana);
const theo = irmaozinho({ humor: 'feliz' }); em(theo, 1.05, 0, 0.4); theo.rotation.y = -0.2; k.cena.add(theo);
const chao = malha(new THREE.CircleGeometry(2.4, 48), new THREE.ShadowMaterial({ opacity: 0.18 }), { sombra: false });
chao.rotation.x = -Math.PI / 2; k.cena.add(chao);
k.cam.position.set(0.3, 2.2, 10.5); k.cam.lookAt(0.25, 1.55, 0);
k.desenhar();
window.PRONTO = true;
</script></body></html>
